<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mental performance coaching for athletes. Build focus, confidence, composure, and stronger responses under pressure." />

    <!-- PWA -->
    <meta name="theme-color" content="#EEF3FF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Arjun" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/arjun/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/arjun/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/brand/arjun/favicon-48.png" />
    <link rel="apple-touch-icon" href="/brand/arjun/apple-touch-icon-180.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />


    <!-- Launch splash: shows before the app's JavaScript loads. React replaces
         it with the matching LaunchScreen component. -->
    <style>
      .arjun-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(120% 60% at 50% 0%,rgba(255,186,140,.32) 0%,rgba(255,186,140,0) 60%),radial-gradient(90% 55% at 50% 100%,rgba(27,77,255,.16) 0%,rgba(27,77,255,0) 70%),#EEF3FF;font-family:Sora,system-ui,sans-serif;text-align:center;padding:0 24px}
      .arjun-splash__name{margin:0;font-size:30px;font-weight:800;letter-spacing:-0.02em;line-height:1;color:#1B4DFF}
      .arjun-splash__line{margin:0;font-size:15px;font-weight:600;color:#4A5273}
      .arjun-splash__art{position:relative;width:200px;height:200px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:8px}
      .arjun-splash__halo{position:absolute;top:12px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.7)}
      .arjun-splash__art img{position:relative}
      @media (prefers-color-scheme: dark){
        .arjun-splash{background-color:#0D1026;background:radial-gradient(120% 60% at 50% 0%,rgba(255,186,140,.18) 0%,rgba(255,186,140,0) 60%),radial-gradient(90% 55% at 50% 100%,rgba(27,77,255,.2) 0%,rgba(27,77,255,0) 70%),#0D1026}
        .arjun-splash__halo{background:rgba(255,255,255,.1)}
        .arjun-splash__name{color:#9DB4FF}
        .arjun-splash__line{color:#B3BAD6}
      }
    </style>

    <title>Arjun — Mental Performance Coach for Athletes</title>
  </head>
  <body>
    <div id="root">
      <div class="arjun-splash" aria-label="Arjun is loading">
        <div class="arjun-splash__art"><span class="arjun-splash__halo"></span><img src="/brand/teer/teer-wave.webp" width="149" height="190" alt="" /></div>
        <p class="arjun-splash__name">Arjun</p>
        <p class="arjun-splash__line">Train your mind like a pro</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
